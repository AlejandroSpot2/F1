<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Position Swings Template</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap");

        :root {
            --bg: #faf8f5;
            --surface: #ffffff;
            --text: #3d2a17;
            --text-soft: #6f5840;
            --border: #d9cabc;
            --grid: #eadfd4;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "IBM Plex Sans", sans-serif;
        }

        main {
            width: min(1120px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 1.5rem 0 2rem;
        }

        h1 {
            margin: 0 0 0.35rem;
            font-size: 2rem;
        }

        p {
            margin: 0 0 1rem;
            color: var(--text-soft);
            max-width: 72ch;
        }

        .frame {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .axis text,
        .axis path,
        .axis line {
            color: var(--text-soft);
            stroke: currentColor;
            font-family: "IBM Plex Sans", sans-serif;
        }

        .legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            color: var(--text-soft);
            font-size: 0.92rem;
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border: 1px solid rgba(61, 42, 23, 0.16);
            border-radius: 4px;
            display: inline-block;
        }

        .chart-hitline,
        .chart-mark {
            cursor: help;
        }

        .chart-tooltip {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            max-width: 240px;
            padding: 0.55rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(61, 42, 23, 0.12);
            font-size: 0.82rem;
            line-height: 1.35;
            opacity: 0;
            transition: opacity 120ms ease;
        }

        .chart-tooltip strong {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.86rem;
        }

        .chart-tooltip span {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .chart-tooltip b {
            color: var(--text-soft);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <main>
        <h1>Race Position Swings</h1>
        <p>
            Starter D3 page for a lap-by-lap line chart. Replace the sample race positions with your final race,
            stint, or driver comparison data before exporting the visualization.
        </p>
        <div class="frame">
            <svg id="chart" viewBox="0 0 1080 620" aria-labelledby="chart-title"></svg>
            <div class="legend" id="legend"></div>
        </div>
    </main>

    <script>
        const sampleSeries = [
            {
                driver: "Norris",
                color: "#8f4f18",
                values: [
                    { lap: 1, position: 4 },
                    { lap: 10, position: 3 },
                    { lap: 20, position: 2 },
                    { lap: 30, position: 2 },
                    { lap: 40, position: 1 },
                    { lap: 50, position: 1 }
                ]
            },
            {
                driver: "Leclerc",
                color: "#b35d2c",
                values: [
                    { lap: 1, position: 2 },
                    { lap: 10, position: 2 },
                    { lap: 20, position: 3 },
                    { lap: 30, position: 3 },
                    { lap: 40, position: 2 },
                    { lap: 50, position: 2 }
                ]
            },
            {
                driver: "Verstappen",
                color: "#2f6f63",
                values: [
                    { lap: 1, position: 1 },
                    { lap: 10, position: 1 },
                    { lap: 20, position: 1 },
                    { lap: 30, position: 4 },
                    { lap: 40, position: 4 },
                    { lap: 50, position: 3 }
                ]
            }
        ];

        const flat = sampleSeries.flatMap((series) => series.values);
        const svg = d3.select("#chart");
        const tooltip = d3.select("body")
            .append("div")
            .attr("class", "chart-tooltip")
            .attr("role", "tooltip")
            .attr("aria-hidden", "true");
        const width = 1080;
        const height = 620;
        const margin = { top: 30, right: 30, bottom: 60, left: 80 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const root = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const x = d3.scaleLinear()
            .domain(d3.extent(flat, (d) => d.lap))
            .range([0, innerWidth]);

        const y = d3.scaleLinear()
            .domain([d3.max(flat, (d) => d.position), 1])
            .range([innerHeight, 0]);

        root.append("g")
            .selectAll("line")
            .data(y.ticks(5))
            .enter()
            .append("line")
            .attr("x1", 0)
            .attr("x2", innerWidth)
            .attr("y1", (d) => y(d))
            .attr("y2", (d) => y(d))
            .attr("stroke", "#eadfd4");

        root.append("g")
            .attr("class", "axis")
            .attr("transform", `translate(0,${innerHeight})`)
            .call(d3.axisBottom(x).ticks(6).tickFormat(d3.format("d")));

        root.append("g")
            .attr("class", "axis")
            .call(d3.axisLeft(y).ticks(5).tickFormat(d3.format("d")));

        const line = d3.line()
            .x((d) => x(d.lap))
            .y((d) => y(d.position))
            .curve(d3.curveMonotoneX);

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function tooltipMarkup(title, rows) {
            const details = rows
                .map(([label, value]) => `<span><b>${escapeHtml(label)}</b>${escapeHtml(value)}</span>`)
                .join("");
            return `<strong>${escapeHtml(title)}</strong>${details}`;
        }

        function moveTooltip(event) {
            let anchorX = event.pageX;
            let anchorY = event.pageY;

            if ((!anchorX || !anchorY) && event.currentTarget) {
                const rect = event.currentTarget.getBoundingClientRect();
                anchorX = window.scrollX + rect.left + rect.width / 2;
                anchorY = window.scrollY + rect.top + rect.height / 2;
            }

            const offset = 14;
            const tooltipRect = tooltip.node().getBoundingClientRect();
            const viewportRight = window.scrollX + document.documentElement.clientWidth - tooltipRect.width - 8;
            const viewportBottom = window.scrollY + document.documentElement.clientHeight - tooltipRect.height - 8;
            const left = Math.max(window.scrollX + 8, Math.min(anchorX + offset, viewportRight));
            const top = Math.max(window.scrollY + 8, Math.min(anchorY + offset, viewportBottom));

            tooltip.style("left", `${left}px`).style("top", `${top}px`);
        }

        function showTooltip(event, html) {
            tooltip
                .html(html)
                .attr("aria-hidden", "false")
                .style("opacity", 1);
            moveTooltip(event);
        }

        function hideTooltip() {
            tooltip
                .attr("aria-hidden", "true")
                .style("opacity", 0);
        }

        function attachTooltip(selection, content) {
            selection
                .attr("tabindex", 0)
                .on("mouseenter focus", (event, d) => showTooltip(event, content(d)))
                .on("mousemove", moveTooltip)
                .on("mouseleave blur", hideTooltip);
        }

        sampleSeries.forEach((series) => {
            root.append("path")
                .datum(series.values)
                .attr("fill", "none")
                .attr("stroke", series.color)
                .attr("stroke-width", 3)
                .attr("d", line);

            const hitline = root.append("path")
                .datum(series)
                .attr("class", "chart-hitline")
                .attr("fill", "none")
                .attr("stroke", "transparent")
                .attr("stroke-width", 12)
                .attr("d", (d) => line(d.values));

            attachTooltip(hitline, (d) => {
                const first = d.values[0];
                const last = d.values[d.values.length - 1];
                return tooltipMarkup(d.driver, [
                    ["First lap", `P${first.position}`],
                    ["Final lap", `P${last.position}`],
                    ["Laps shown", d.values.length]
                ]);
            });

            const points = root.selectAll(`circle-${series.driver}`)
                .data(series.values)
                .enter()
                .append("circle")
                .attr("class", "chart-mark")
                .attr("cx", (d) => x(d.lap))
                .attr("cy", (d) => y(d.position))
                .attr("r", 4)
                .attr("fill", series.color);

            attachTooltip(points, (d) => tooltipMarkup(series.driver, [
                ["Lap", d.lap],
                ["Position", d.position]
            ]));
        });

        root.append("text")
            .attr("x", 0)
            .attr("y", -8)
            .attr("font-size", 14)
            .attr("font-weight", 600)
            .text("Sample race positions by lap");

        root.append("text")
            .attr("x", innerWidth / 2)
            .attr("y", innerHeight + 45)
            .attr("text-anchor", "middle")
            .attr("font-size", 12)
            .text("Lap number");

        root.append("text")
            .attr("transform", "rotate(-90)")
            .attr("x", -innerHeight / 2)
            .attr("y", -55)
            .attr("text-anchor", "middle")
            .attr("font-size", 12)
            .text("Position");

        const legend = d3.select("#legend");
        sampleSeries.forEach((series) => {
            const item = legend.append("span");
            item.append("span")
                .attr("class", "swatch")
                .style("background", series.color);
            item.append("span").text(series.driver);
        });
    </script>
</body>
</html>
